<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ninth Life</title>
  <meta name="description" content="Ninth Life — an independent game and app studio.">
  <style>
    :root {
      --bg: #050507;
      --purple: #b24bf3;
      --blue: #3ec9f0;
      --text: #e8e8ee;
      --muted: #9a9aa8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6vh 6vw;
      text-align: center;
      position: relative;
      overflow-x: hidden;
    }
    /* soft ambient glow behind everything, echoing the logo's neon */
    body::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1100px;
      height: 700px;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(circle at 30% 50%, rgba(178, 75, 243, 0.14), transparent 60%),
        radial-gradient(circle at 70% 50%, rgba(62, 201, 240, 0.14), transparent 60%);
      filter: blur(10px);
      z-index: 0;
      pointer-events: none;
    }

    .logo {
      position: relative;
      z-index: 1;
      width: min(560px, 80vw);
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .blurb {
      position: relative;
      z-index: 1;
      max-width: 540px;
      margin: 2rem auto 0;
      font-size: 1.05rem;
      line-height: 1.65;
      color: var(--muted);
    }

    .blurb strong {
      color: var(--text);
      font-weight: 600;
    }

    .apps {
      position: relative;
      z-index: 1;
      margin-top: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .apps h2 {
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin: 0 0 0.25rem;
    }

    .app-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
    }

    .app-links a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      padding: 0.55rem 1.1rem;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .app-links a:hover {
      border-color: var(--blue);
      background: rgba(62, 201, 240, 0.08);
    }

    .app-links .placeholder {
      color: var(--muted);
      border-style: dashed;
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 4rem;
      font-size: 0.78rem;
      color: #55555f;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>

  <img class="logo" src="logo.png" alt="Ninth Life">

  <p class="blurb">
    <strong>Ninth Life</strong> is an independent studio making small, focused games and apps —
    built nights and weekends, shipped when they're ready, not before.
  </p>

  <div class="apps">
    <h2>Apps &amp; Games</h2>
    <div class="app-links">
      <a href="#" class="placeholder">Coming soon</a>
    </div>
  </div>

  <footer>&copy; 2026 Ninth Life LLC</footer>

</body>
</html>
